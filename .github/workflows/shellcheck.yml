name: ShellCheck (lint)

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on scripts
        run: |
          files="repo-sync.sh"
          for f in scripts/*.sh; do files="$files $f"; done
          for f in $files; do
            if [[ -f "$f" ]]; then
              echo "---- shellcheck $f ----"
              shellcheck "$f" || true
            fi
          done